name: CI
on:
  push:
  pull_request:
jobs:
  backend:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: churnscope
          POSTGRES_PASSWORD: churnscope
          POSTGRES_DB: churnscope
        ports:
          - 5433:5432
        options: >-
          --health-cmd "pg_isready -U churnscope"
          --health-interval 2s
          --health-retries 20
    env:
      # DB tests run against the service above; under CI they fail (never skip) if it is down.
      TEST_DATABASE_URL: postgresql+psycopg://churnscope:churnscope@localhost:5433/churnscope_test
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
      - run: uv sync
      - run: uv run ruff check .
      - run: uv run ruff format --check .
      - run: uv run pytest -q
  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
      - run: uv sync
      - run: uv run ruff check .
